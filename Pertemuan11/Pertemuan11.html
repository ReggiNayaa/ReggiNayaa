<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 11 Regi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-placeholder::placeholder {
            color: #9ca3af; 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Header Pencarian -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold mb-2">Pencarian Buku</h1>
            <p class="text-gray-600 mb-6">Cari koleksi buku berdasarkan kriteria yang Anda inginkan.</p>
            
            <!-- Input Pencarian -->
            <div class="flex flex-col sm:flex-row gap-4 mb-4">
                <input type="text" id="searchInput" placeholder="Masukkan kata kunci..." class="flex-grow w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="yearInput" placeholder="Tahun" class="w-full sm:w-32 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 custom-placeholder" disabled>
            </div>
            
            <!-- Opsi Filter -->
            <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
                <span class="font-semibold">Cari berdasarkan:</span>
                <div class="flex items-center">
                    <input type="radio" id="title" name="searchType" value="title" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500" checked>
                    <label for="title" class="ml-2 block text-sm text-gray-900">Judul</label>
                </div>
                <div class="flex items-center">
                    <input type="radio" id="author" name="searchType" value="author" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                    <label for="author" class="ml-2 block text-sm text-gray-900">Penulis</label>
                </div>
                <div class="flex items-center">
                    <input type="radio" id="publisher" name="searchType" value="publisher" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                    <label for="publisher" class="ml-2 block text-sm text-gray-900">Penerbit</label>
                </div>
                <div class="flex items-center">
                    <input type="radio" id="titleYear" name="searchType" value="titleYear" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                    <label for="titleYear" class="ml-2 block text-sm text-gray-900">Judul & Tahun</label>
                </div>
            </div>
        </div>
        
        <!-- Kontainer untuk hasil pencarian -->
        <div id="book-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Kartu buku akan dimasukkan di sini oleh JavaScript -->
        </div>

        <!-- Pesan jika tidak ada hasil -->
        <div id="no-results" class="hidden text-center py-10">
            <h2 class="text-xl font-semibold text-gray-700">Tidak ada hasil</h2>
            <p class="text-gray-500 mt-2">Coba gunakan kata kunci atau filter yang berbeda.</p>
        </div>
    </div>

    <script>
        // --- DATA BUKU ---
        // Array objek yang berisi data buku. Bertindak sebagai database sederhana.
        const books = [
            {
                title: 'Menguasai Pemrograman Berorientasi Objek',
                author: 'Ade Rahmat Iskandar',
                publisher: 'Informatika',
                year: 2020,
                image: 'https://placehold.co/400x600/3498db/ffffff?text=OOP'
            },
            {
                title: 'Dasar-Dasar Pemrograman dengan .NET',
                author: 'Ade Rahmat Iskandar',
                publisher: 'Informatika',
                year: 2019,
                image: 'https://placehold.co/400x600/2ecc71/ffffff?text=.NET'
            },
            {
                title: 'Metodologi Pengembangan Sistem Informasi',
                author: 'Samiaji Sarosa',
                publisher: 'Indeks',
                year: 2017,
                image: 'https://placehold.co/400x600/9b59b6/ffffff?text=Sistem+Info'
            },
            {
                title: 'Struktur Data',
                author: 'Rosa A.S',
                publisher: 'Modula',
                year: 2018,
                image: 'https://placehold.co/400x600/f1c40f/ffffff?text=Struktur+Data'
            },
            {
                title: 'Dasar Pemrograman Python 3',
                author: 'Abdul Kadir',
                publisher: 'Andi Publisher',
                year: 2018,
                image: 'https://placehold.co/400x600/e74c3c/ffffff?text=Python+3'
            },
            {
                title: 'Teori Dan Praktek Sistem Operasi',
                author: 'Zaid Romegar Mair',
                publisher: 'Deeppublish',
                year: 2018,
                image: 'https://placehold.co/400x600/1abc9c/ffffff?text=Sistem+Operasi'
            }
        ];

        // --- ELEMEN DOM ---
        const bookListContainer = document.getElementById('book-list');
        const noResultsMessage = document.getElementById('no-results');
        const searchInput = document.getElementById('searchInput');
        const yearInput = document.getElementById('yearInput');
        const searchTypeRadios = document.querySelectorAll('input[name="searchType"]');

        // --- FUNGSI ---

        /**
         * Merender daftar buku ke dalam DOM.
         * @param {Array} booksToRender - Array buku yang akan ditampilkan.
         */
        function renderBooks(booksToRender) {
            // Bersihkan kontainer sebelum merender
            bookListContainer.innerHTML = ''; 

            if (booksToRender.length === 0) {
                noResultsMessage.classList.remove('hidden');
                bookListContainer.classList.add('hidden');
            } else {
                noResultsMessage.classList.add('hidden');
                bookListContainer.classList.remove('hidden');

                booksToRender.forEach(book => {
                    const bookCard = `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden transform hover:-translate-y-1 transition-transform duration-300">
                            <img src="${book.image}" alt="Sampul buku ${book.title}" class="w-full h-64 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/400x600/cccccc/ffffff?text=Image+Not+Found';">
                            <div class="p-4">
                                <h3 class="font-bold text-lg truncate" title="${book.title}">${book.title}</h3>
                                <p class="text-gray-700 text-sm mt-1">Penulis: ${book.author}</p>
                                <p class="text-gray-500 text-sm mt-1">Penerbit: ${book.publisher}</p>
                                <p class="text-gray-500 text-sm mt-1">Tahun: ${book.year}</p>
                            </div>
                        </div>
                    `;
                    bookListContainer.innerHTML += bookCard;
                });
            }
        }

        /**
         * Melakukan filter dan merender ulang buku berdasarkan input pengguna.
         */
        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const yearTerm = yearInput.value;
            const searchType = document.querySelector('input[name="searchType"]:checked').value;

            const filteredBooks = books.filter(book => {
                const titleMatch = book.title.toLowerCase().includes(searchTerm);
                const authorMatch = book.author.toLowerCase().includes(searchTerm);
                const publisherMatch = book.publisher.toLowerCase().includes(searchTerm);
                const yearMatch = yearTerm ? book.year.toString() === yearTerm : true;

                switch (searchType) {
                    case 'title':
                        return titleMatch;
                    case 'author':
                        return authorMatch;
                    case 'publisher':
                        return publisherMatch;
                    case 'titleYear':
                        return titleMatch && yearMatch;
                    default:
                        return true;
                }
            });

            renderBooks(filteredBooks);
        }

        /**
         * Mengelola status aktif/nonaktif input tahun.
         */
        function handleRadioChange() {
            const searchType = document.querySelector('input[name="searchType"]:checked').value;
            if (searchType === 'titleYear') {
                yearInput.disabled = false;
                yearInput.classList.remove('custom-placeholder');
            } else {
                yearInput.disabled = true;
                yearInput.value = '';
                yearInput.classList.add('custom-placeholder');
            }
            // Lakukan pencarian setiap kali radio button diubah
            handleSearch();
        }

        // --- EVENT LISTENERS ---
        
        // Listener untuk input teks pencarian
        searchInput.addEventListener('input', handleSearch);
        
        // Listener untuk input tahun
        yearInput.addEventListener('input', handleSearch);

        // Listener untuk setiap radio button
        searchTypeRadios.forEach(radio => {
            radio.addEventListener('change', handleRadioChange);
        });

        // --- INISIALISASI ---
        // Tampilkan semua buku saat halaman pertama kali dimuat
        window.onload = () => {
            renderBooks(books);
        };
    </script>

</body>
</html>
