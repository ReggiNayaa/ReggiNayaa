<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perancangan Web 6</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="d-flex justify-content-center align-items-center min-vh-100 bg-gradient-green">
    <div class="card p-4 shadow-lg" style="width: 22rem; background-color: #2ecc71;">
      <h4 class="text-center text-white mb-4">Silahkan Isikan Data</h4>
      <form>
        <div class="mb-2">
          <input type="text" class="form-control" placeholder="First name" required />
        </div>
        <div class="mb-2">
          <input type="text" class="form-control" placeholder="Middle name" required />
        </div>
        <div class="mb-2">
          <input type="text" class="form-control" placeholder="Last name" required />
        </div>
        <div class="mb-2">
          <input type="date" class="form-control" placeholder="Tanggal Lahir" required />
        </div>
        <div class="mb-2 text-white">
          Jenis Kelamin:
          <div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="pria" value="Pria" required />
              <label class="form-check-label" for="pria">Pria</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="wanita" value="Wanita" />
              <label class="form-check-label" for="wanita">Wanita</label>
            </div>
          </div>
        </div>
        <div class="mb-2">
          <input type="text" class="form-control" placeholder="Tempat Tinggal" required />
        </div>
        <div class="mb-2">
          <input type="email" class="form-control" placeholder="Email" required />
        </div>
        <div class="mb-2">
          <input type="tel" class="form-control" placeholder="Phone" required />
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" placeholder="Password" required />
        </div>
        <button type="submit" class="btn btn-light w-100 fw-bold text-success">REGISTER</button>
      </form>
      <div class="text-center mt-3">
        <span class="text-white">Kembali <a href="#" class="text-white text-decoration-underline">Back</a></span>
      </div>
    </div>
  </div>
</body>
</html>
